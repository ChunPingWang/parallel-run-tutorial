# =====================================================================
# nginx-shadow.conf  -  VM 側影子閘道（ADR-001 備案 / ADR-002 方案 A）
# ---------------------------------------------------------------------
# 僅在「必須即時鏡像」時採用。預設請走 GoReplay（scripts/01-record.sh）。
#
# 部署：shadow-gw VM ×2（Active/Standby），掛在既有 L4 VIP 後方。
# 回退：把 $mirror_uri 固定成 "off" 後 `nginx -s reload`（< 30 秒生效）。
#
# 需要 nginx >= 1.13.4（ngx_http_mirror_module）
# =====================================================================

upstream legacy_vm {
    server 10.0.1.10:8080 max_fails=3 fail_timeout=10s;
    server 10.0.1.11:8080 max_fails=3 fail_timeout=10s;
    keepalive 64;
}

# 新應用在 K8s：指向 Ingress / LoadBalancer VIP
upstream new_k8s {
    server k8s-ingress.internal:443 max_fails=0;   # max_fails=0：影子端故障不得影響閘道
    keepalive 32;
}

# ---------------------------------------------------------------------
# 鏡像比例控制
#   以 $request_id 雜湊分流，同一請求的分派結果穩定。
#   調整比例後 reload 即可，無需改動 location 區塊。
# ---------------------------------------------------------------------
split_clients "${request_id}" $shadow_bucket {
    10%     "on";      # Phase 1 起手 10%，逐步調至 50% / 100%
    *       "off";
}

map $shadow_bucket $mirror_uri {
    "on"    "/shadow";
    default "/mirror-disabled";
}

log_format shadow_json escape=json
  '{"ts":"$time_iso8601","correlation_id":"$request_id",'
  '"method":"$request_method","uri":"$uri","status":$status,'
  '"upstream_time":"$upstream_response_time","total_time":$request_time,'
  '"shadow":"$shadow_bucket"}';

server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/shadow.log shadow_json;

    # -----------------------------------------------------------------
    # 主線：回應由 legacy 提供，client 感受不到鏡像存在
    # -----------------------------------------------------------------
    location / {
        mirror $mirror_uri;

        # POST/PUT 需要，但會強制 buffer 整個 body。
        # 大檔上傳端點請在此之前以獨立 location 排除。
        mirror_request_body on;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-Id  $request_id;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_pass http://legacy_vm;
    }

    # 排除不適合鏡像的端點（長連線、大檔）
    location /api/v1/files/ {
        proxy_set_header Host $host;
        proxy_pass http://legacy_vm;
    }

    location /ws/ {
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_pass http://legacy_vm;
    }

    # -----------------------------------------------------------------
    # 影子線：回應直接丟棄
    # -----------------------------------------------------------------
    location = /shadow {
        internal;

        # ---- 混合拓撲關鍵：K8s Ingress 依 Host/SNI 選 backend ----
        proxy_set_header Host new-app.bank.internal;
        proxy_ssl_server_name on;
        proxy_ssl_name        new-app.bank.internal;
        proxy_ssl_verify      on;
        proxy_ssl_trusted_certificate /etc/nginx/ca/internal-ca.pem;

        # ---- Shadow header 契約（ADR-006）----
        proxy_set_header X-Shadow-Request  "true";
        proxy_set_header X-Correlation-Id  $request_id;
        proxy_set_header X-Origin-Platform "vm";
        proxy_set_header X-Original-Host   $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding   "identity";

        # 冪等鍵改寫，避免被防重放機制擋下
        set $idem_shadow "";
        if ($http_idempotency_key) {
            set $idem_shadow "${http_idempotency_key}-shadow";
        }
        proxy_set_header Idempotency-Key $idem_shadow;

        # 不沿用原 trace，避免 APM 兩條 trace 互相污染
        proxy_set_header traceparent "";
        proxy_set_header tracestate  "shadow=1";

        # ---- 關鍵：影子端絕不可拖累主線 ----
        # Nginx 主連線在子請求結束前不會釋放，timeout 必須壓短。
        proxy_connect_timeout 200ms;
        proxy_send_timeout    2s;
        proxy_read_timeout    2s;
        proxy_next_upstream   off;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_pass https://new_k8s$request_uri;
    }

    # 鏡像關閉時的空目標（回退用）
    location = /mirror-disabled {
        internal;
        return 204;
    }
}
