# =====================================================================
# t14-test-pods.yaml  -  T-14（NetworkPolicy 實際生效）驗證用測試 Pod
# ---------------------------------------------------------------------
# 搭配 verify/t14-networkpolicy.sh 使用。標籤刻意對齊
# config/k8s/shadow-namespace.yaml 中 allow-shadow-egress 的 podSelector，
# 以驗證「白名單放行的通、沒放行的擋」。
#
# ⚠ shadow namespace 有 ResourceQuota 約束 requests/limits，因此每個容器
#   都必須明確宣告資源，否則 Pod 會被 quota 拒絕建立。
# ⚠ 這些 Pod 僅供驗證，跑完請刪除（腳本的 --cleanup 會處理）。
# =====================================================================
---
apiVersion: v1
kind: Pod
metadata:
  name: t14-shadow-db
  namespace: shadow
  labels: { app: shadow-db }            # 白名單放行目標（TCP 5432）
spec:
  containers:
  - name: srv
    image: python:3.13-alpine
    command: ["python", "-m", "http.server", "5432"]
    readinessProbe:                     # 必要：Ready 才代表埠真的在聽
      tcpSocket: { port: 5432 }
      periodSeconds: 2
    resources:
      requests: { cpu: "10m", memory: 32Mi }
      limits:   { cpu: "10m", memory: 32Mi }
---
apiVersion: v1
kind: Pod
metadata:
  name: t14-wiremock
  namespace: shadow
  labels: { app: wiremock }             # 白名單放行目標（TCP 8080）
spec:
  containers:
  - name: srv
    image: python:3.13-alpine
    command: ["python", "-m", "http.server", "8080"]
    readinessProbe:
      tcpSocket: { port: 8080 }
      periodSeconds: 2
    resources:
      requests: { cpu: "10m", memory: 32Mi }
      limits:   { cpu: "10m", memory: 32Mi }
---
apiVersion: v1
kind: Pod
metadata:
  name: t14-not-whitelisted
  namespace: shadow
  labels: { app: some-other-service }   # 刻意未列入白名單，必須被擋
spec:
  containers:
  - name: srv
    image: python:3.13-alpine
    command: ["python", "-m", "http.server", "8080"]
    readinessProbe:
      tcpSocket: { port: 8080 }
      periodSeconds: 2
    resources:
      requests: { cpu: "10m", memory: 32Mi }
      limits:   { cpu: "10m", memory: 32Mi }
---
apiVersion: v1
kind: Pod
metadata:
  name: t14-newapp-probe
  namespace: shadow
  labels: { app: new-app }              # 與 allow-shadow-egress 的 podSelector 相同
spec:
  containers:
  - name: probe
    image: python:3.13-alpine
    command: ["sleep", "3600"]
    resources:
      requests: { cpu: "10m", memory: 32Mi }
      limits:   { cpu: "10m", memory: 32Mi }
---
apiVersion: v1
kind: Pod
metadata:
  name: t14-rogue-probe
  namespace: shadow
  labels: { app: rogue }                # 不符任何放行規則 -> 只受 default-deny 管
spec:
  containers:
  - name: probe
    image: python:3.13-alpine
    command: ["sleep", "3600"]
    resources:
      requests: { cpu: "10m", memory: 32Mi }
      limits:   { cpu: "10m", memory: 32Mi }
---
# 對照組：放在 shadow 之外，不受任何 policy 管。
# 沒有它就無法區分「被 policy 擋下」與「本來就不通」—— 後者會給出假通過。
apiVersion: v1
kind: Pod
metadata:
  name: t14-control-probe
  namespace: default
  labels: { app: t14-control }
spec:
  containers:
  - name: probe
    image: python:3.13-alpine
    command: ["sleep", "3600"]
